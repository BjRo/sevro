[workspace]
members = ["crates/sevro"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.15"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/BjRo/sevro"

[workspace.dependencies]
data-encoding = "=2.11.1"
jsonschema = { version = "=0.58.6", default-features = false }
nix = { version = "=0.30.1", default-features = false, features = ["signal", "process", "user", "hostname"] }
regress = { version = "=0.12.0", features = ["utf16"] }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_jcs = "=0.2.0"
sha2 = "=0.10.9"
signal-hook = { version = "=0.3.18", default-features = false, features = ["iterator"] }
toml = "=1.1.5"
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# QuickJS's unoptimized C interpreter exhausts its default stack while AJV
# compiles ordinary schemas. Keep the dependency at release optimization in
# debug/test builds without changing authored Rust or runtime resource limits.
[profile.dev.package.rquickjs-sys]
opt-level = 3

