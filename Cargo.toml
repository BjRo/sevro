[workspace]
members = ["crates/sevro"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.15"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/BjRo/sevro"

[workspace.dependencies]
jsonschema = { version = "=0.58.6", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_jcs = "=0.2.0"
sha2 = "=0.10.9"
toml = "=1.1.5"
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

