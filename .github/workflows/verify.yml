name: Verify Sevro

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  quality-plan:
    name: Select quality evidence
    runs-on: ubuntu-24.04
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select existing CI for release metadata
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-ci.py
      - name: Retain reused quality evidence
        if: steps.plan.outputs.reuse == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-ci-${{ github.sha }}
          path: .quality/release-ci.json
          include-hidden-files: true
          if-no-files-found: error
  verify:
    name: TypeScript gate / ${{ matrix.phase }} (Ubuntu x64)
    needs: quality-plan
    if: needs.quality-plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        phase: [static, docs, package]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.13-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Prepare Linux isolation
        if: matrix.phase != 'static'
        run: bash scripts/setup-ci-linux.sh
      - name: Cache pinned native hosts
        if: matrix.phase == 'docs'
        id: native-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/sevro-ci/native-hosts
          # The setup script owns both pinned versions and the installation layout.
          key: native-hosts-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-ci-codex.ts') }}
      - name: Install deterministic native host prerequisites
        if: matrix.phase == 'docs'
        env:
          SEVRO_CI_NATIVE_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
        run: SEVRO_CI_NATIVE_CACHE="$HOME/.cache/sevro-ci/native-hosts" bun scripts/setup-ci-codex.ts
      - uses: astral-sh/setup-uv@v7
        if: matrix.phase == 'docs'
        with:
          version: "0.11.21"
      - uses: jdx/mise-action@v3
        if: matrix.phase == 'docs'
        with:
          version: "2026.3.13"
          install: false
          # Isolated checks use setup-node's direct binary, not mutable mise shims.
          add_shims_to_path: false
      - name: Install tutorial's declared mise tool
        if: matrix.phase == 'docs'
        run: mise install node@24.13.0
      - run: bun install --frozen-lockfile
      - name: Canonical TypeScript quality phase
        run: bun run check:typescript --phase ${{ matrix.phase }}
  test-shards:
    name: TypeScript tests / shard ${{ matrix.shard }} of 4 (Ubuntu x64)
    needs: quality-plan
    if: needs.quality-plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.13-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Prepare Linux isolation
        run: bash scripts/setup-ci-linux.sh
      - name: Cache pinned native hosts
        id: native-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/sevro-ci/native-hosts
          key: native-hosts-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-ci-codex.ts') }}
      - name: Install deterministic native host prerequisites
        env:
          SEVRO_CI_NATIVE_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
        run: SEVRO_CI_NATIVE_CACHE="$HOME/.cache/sevro-ci/native-hosts" bun scripts/setup-ci-codex.ts
      - run: bun install --frozen-lockfile
      - name: Canonical TypeScript quality shard
        run: bun run check:typescript --shard ${{ matrix.shard }}/4
      - name: Retain shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ github.sha }}-${{ matrix.shard }}
          overwrite: true
          path: .quality/shards/
          include-hidden-files: true
          if-no-files-found: error
  verify-tests:
    name: TypeScript gate / tests (Ubuntu x64)
    needs: [quality-plan, test-shards]
    if: always() && !cancelled() && needs.quality-plan.result == 'success' && needs.quality-plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Require all four test shards
        env:
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.13-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-${{ github.sha }}-*
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: .quality/shards/
          merge-multiple: true
      - name: Canonical TypeScript quality phase
        run: bun run check:typescript --merge-shards
      - name: Retain quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-quality-${{ github.sha }}
          overwrite: true
          path: .quality/
          include-hidden-files: true
          if-no-files-found: warn
  release-metadata:
    name: Release metadata checks
    needs: quality-plan
    if: needs.quality-plan.outputs.reuse == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.13-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Check release workflow syntax
        run: python3 -c 'import ast, pathlib; ast.parse(pathlib.Path(".github/scripts/release-ci.py").read_text())'
      - name: Static release metadata checks
        run: bun run check:typescript --fast
  typescript-quality:
    name: TypeScript quality
    needs: [quality-plan, verify, test-shards, verify-tests, release-metadata]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete or reused quality evidence
        env:
          PLAN_RESULT: ${{ needs.quality-plan.result }}
          REUSE: ${{ needs.quality-plan.outputs.reuse }}
          QUALITY_RESULT: ${{ needs.verify.result }}
          SHARD_RESULT: ${{ needs.test-shards.result }}
          TEST_RESULT: ${{ needs.verify-tests.result }}
          METADATA_RESULT: ${{ needs.release-metadata.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$REUSE" = true ]; then
            test "$QUALITY_RESULT" = skipped
            test "$SHARD_RESULT" = skipped
            test "$TEST_RESULT" = skipped
            test "$METADATA_RESULT" = success
          else
            test "$QUALITY_RESULT" = success
            test "$SHARD_RESULT" = success
            test "$TEST_RESULT" = success
            test "$METADATA_RESULT" = skipped
          fi
