name: Verify Sevro

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install deterministic sandbox prerequisite
        run: npm install --global --ignore-scripts @openai/codex@0.156.1
      - run: bun install --frozen-lockfile
      - run: bun run schemas:check
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun test --timeout 15000
      - run: bun run test:package-install
