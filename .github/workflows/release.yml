name: Release Sevro

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag matching the package version
        required: true
        type: string
      publish:
        description: Publish the verified tarball to npm
        required: true
        default: false
        type: boolean
      expected_sha256:
        description: Reviewed tarball SHA-256 (required when publishing)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: sevro-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-26-intel
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install deterministic native host prerequisites
        run: bun scripts/setup-ci-codex.ts
      - run: bun install --frozen-lockfile
      - run: bun run schemas:check
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun test --timeout 15000
      - name: Prepare the tagged package
        run: bun run release:prepare --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/sevro-release"
      - name: Bind publication to the reviewed archive
        if: inputs.publish || inputs.expected_sha256 != ''
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          bun -e '
            const expected = process.env.EXPECTED_SHA256;
            if (!expected || !/^[0-9a-f]{64}$/.test(expected))
              throw new Error("Publishing requires the reviewed tarball SHA-256");
            const record = await Bun.file(process.env.RUNNER_TEMP + "/sevro-release/release.json").json();
            const actual = new Bun.CryptoHasher("sha256")
              .update(await Bun.file(record.archive).arrayBuffer()).digest("hex");
            if (actual !== expected)
              throw new Error("Release archive differs from the reviewed tarball");
            console.log("Reviewed release archive SHA-256 verified: " + actual);
          '
      - name: Install and verify that exact tarball
        run: bun run test:package-install --tarball "$RUNNER_TEMP/sevro-release/bjoernrochel-sevro-${RELEASE_TAG#v}.tgz"
      - uses: actions/upload-artifact@v7
        with:
          name: sevro-release
          path: ${{ runner.temp }}/sevro-release/
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --global npm@11.20.0
      - uses: actions/download-artifact@v8
        with:
          name: sevro-release
          path: ${{ runner.temp }}/sevro-release/
      - name: Verify artifact checksum
        working-directory: ${{ runner.temp }}/sevro-release
        run: sha256sum --check SHA256SUMS
      - name: Publish the verified artifact with trusted publishing
        run: npm publish "$RUNNER_TEMP/sevro-release/bjoernrochel-sevro-${RELEASE_TAG#v}.tgz" --ignore-scripts
